<!DOCTYPE html>
<html>
<head>
<title>Puzzle Bobble</title>
<meta charset="UTF-8">
</head>
<body class="container-fluid">

<div class="row">
    <!-- <div class="col-sm-12" style="text-align: center;font-size: 60px;font-weight: bolder;">XBOX Puzzle Bobble</div> -->
    <div class="col-sm-12" style="text-align: center;font-size: 60px;font-weight: bolder;">
        <img src="images/title.png" style="display: block;margin-left: auto;margin-right: auto;width: 200px;">
    </div>

    <button id="muteBtn" class="btn btn-light" 
        style="position: fixed; top: 20px; right: 20px; z-index: 1000; border-radius: 50%; width: 50px; height: 50px; border: 2px solid green;">
        <i id="musicIcon" class="fas fa-music" style="color: green; font-size: 20px;"></i>
    </button>
</div>
<div class="row" style="margin-left: 50px;margin-right: 50px;">
    <div class="col-sm-3">
        <div class="card" style="display: block;margin-left: auto;margin-right: auto;">
            <div class="card-header text-center" style="font-size: 20px;font-weight: bolder;">Game Info</div>    

            <div class="card-body">
                
                <div class="input-group input-group-sm">
                    <div class="input-group-prepend fs-5">
                        <div class="input-group-text px-1 font-bolder fs-5">Name : </div>
                    </div>
                    <input id="player_name" class="form-control form-control-sm font-bolder fs-5" type="text" value="" placeholder="Player Name">
                </div>

                <div class="input-group input-group-sm">
                    <div class="input-group-prepend">
                        <div class="input-group-text px-1 font-bolder fs-5">Level : </div>
                    </div>
                    <input id="game_level" class="form-control form-control-sm text-center font-bolder fs-5" type="number" min="1" value="1" disabled>
                </div>


                <div class="input-group input-group-sm">
                    <div class="input-group-prepend">
                        <div class="input-group-text px-1 font-bolder fs-5">Score : </div>
                    </div>
                    <input id="game_score" class="form-control form-control-sm text-center font-bolder fs-5" type="number" min="0" value="0" disabled>
                </div>

                <div class="mt-1">
                    <button id="game_start" class="btn btn-outline-success btn-sm w-100 mt-1 font-bolder fs-5" onclick="start_game()">Start</button>
                    <button class="btn btn-outline-warning btn-sm w-100 mt-1 font-bolder fs-5" onclick="restart_game()">Restart</button>
                </div>
            </div>
        </div>

        <div class="card mt-3">
            <div class="row g-0">
                <div class="col-5 col-sm-4">
                    <div class="card-header text-center" style="font-size: 15px; font-weight: bolder;">Shooter Speed</div>   
                </div>
                <div class="col-7 col-sm-8">
                <div class="card-body d-flex justify-content-center align-items-center" style="color: green;">
                    <div id="controls">
                        <input type="number" id="rotationSpeed" min="0.5" max="10" step="0.5" value="2" 
                            style="width: 80px; text-align: center; border: 2px solid green; border-radius: 5px; font-weight: bold;">
                        <span style="font-weight: bold; margin-left: 5px;">deg</span>
                    </div>
                </div>
                </div>
            </div>
            </div>

    </div>

    <div class="col-sm-6">
        <canvas id="game"></canvas>
    </div>

    <div class="col-sm-3">
        <div class="card">
            <div class="card-header font-bolder text-center" style="font-size: 20px;">
                Bobble Time!
            </div>
            <div class="card-body">
                <div id="timer" class="font-bolder" style="font-size: 20px;text-align: center;display: block;">0</div>
            </div>
        </div>
        <div class="card mt-3">
            <div class="card-header text-center" style="font-size: 20px;font-weight: bolder;">Scores</div>  
            <table id="scoreboard" class="m-4 fs-5">
            </table>
        </div> 
    </div>
</div>
</body>

<link rel="stylesheet" href="dist/font-awesome/css/all.css" type="text/css">
<link href="dist/bootstrap-5.1.3/css/bootstrap.min.css" rel="stylesheet">
<script src="dist/bootstrap-5.1.3/js/bootstrap.min.js"></script>
<script src="dist/bootstrap-5.1.3/popper.js"></script>

<script src="dist/jquery-3.6.0.min.js"></script>

<script src="js/topscores.js"></script>
<script src="js/main.js"></script>
<link rel="stylesheet" type="text/css" href="css/main.css" />

</html>
